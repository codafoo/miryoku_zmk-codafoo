# Catppuccin Mocha theme with larger keys
draw_config:
  dark_mode: true

  # Make keys larger to fit more text
  key_w: 80.0      # default: 60.0
  key_h: 70.0      # default: 56.0

  # Adjust spacing
  split_gap: 40.0  # default: 30.0
  inner_pad_w: 3.0 # default: 2.0
  inner_pad_h: 3.0 # default: 2.0

  svg_extra_style: |
    /* Catppuccin Mocha palette */
    svg.keymap {
      background-color: #1e1e2e;
    }
    text {
      fill: #cdd6f4;
    }
    rect.key {
      fill: #313244;
      stroke: #45475a;
    }
    rect.combo {
      fill: #45475a;
      stroke: #585b70;
    }
    .hold text {
      fill: #89dceb;  /* Sky */
      font-weight: 600;
    }
    .shifted text {
      fill: #cba6f7;  /* Mauve */
    }
    .layer-activator {
      fill: #a6e3a1;  /* Green */
      font-weight: 700;
    }
    .tap.hold text {
      fill: #89b4fa;  /* Blue */
    }
