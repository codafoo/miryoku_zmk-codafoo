# Dark mode theme for keymap-drawer
draw_config:
  dark_mode: true
  svg_extra_style: |
    /* Additional dark mode customizations */
    svg.keymap {
      background-color: #1a1a1a;
    }
    text {
      fill: #e0e0e0;
    }
    rect.key, rect.combo {
      stroke: #555555;
    }
    /* Highlight home row mods */
    .hold text {
      fill: #88c0d0;
      font-weight: 600;
    }
    /* Layer activators */
    .layer-activator {
      fill: #a3be8c;
      font-weight: 700;
    }
