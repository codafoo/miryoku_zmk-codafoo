name: 'Build All Keyboards with ZMK Studio'
on: workflow_dispatch
jobs:
  # Corne
  corne-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_left nice_view_adapter nice_view"]'
      snippet: '["studio-rpc-usb-uart"]'
  corne-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_right nice_view_adapter nice_view"]'
      snippet: '["studio-rpc-usb-uart"]'
  # Urchin
  urchin-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["urchin_left nice_view_adapter nice_view"]'
      snippet: '["studio-rpc-usb-uart"]'
  urchin-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["urchin_right nice_view_adapter nice_view"]'
      snippet: '["studio-rpc-usb-uart"]'

  # Ergonaut One (seeeduino_xiao_ble)
  ergonaut-one-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_left"]'
      snippet: '["studio-rpc-usb-uart"]'
  ergonaut-one-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_right"]'
      snippet: '["studio-rpc-usb-uart"]'

  # Ergonaut One S (seeeduino_xiao_ble)
  ergonaut-one-s-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_s_left"]'
      snippet: '["studio-rpc-usb-uart"]'
  ergonaut-one-s-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_s_right"]'
      snippet: '["studio-rpc-usb-uart"]'

  # Flake (nice_nano_v2 - uses v1.0 with pro_micro connector)
  flake-nicenano-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["anywhy_flake_left"]'
      snippet: '["studio-rpc-usb-uart"]'
  flake-nicenano-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["anywhy_flake_right"]'
      snippet: '["studio-rpc-usb-uart"]'

  # Flake (seeeduino_xiao_ble - uses main branch with xiao_d connector)
  flake-xiao-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["anywhy_flake_left"]'
      snippet: '["studio-rpc-usb-uart"]'
  flake-xiao-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["anywhy_flake_right"]'
      snippet: '["studio-rpc-usb-uart"]'

  # roBa (seeeduino_xiao_ble - with PMW3610 trackball)
  roBa-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["roBa_left"]'
      snippet: '["studio-rpc-usb-uart"]'
  roBa-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["roBa_right"]'
      snippet: '["studio-rpc-usb-uart"]'

  # bykeeb (seeeduino_xiao_ble - fingerpunch)
  bykeeb-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["bykeeb_left"]'
      snippet: '["studio-rpc-usb-uart"]'
  bykeeb-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["bykeeb_right"]'
      snippet: '["studio-rpc-usb-uart"]'
