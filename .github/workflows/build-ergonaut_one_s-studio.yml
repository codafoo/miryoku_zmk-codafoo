name: 'Build Ergonaut One S with ZMK Studio'
on: workflow_dispatch
jobs:
  build-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_s_left"]'
      snippet: '["studio-rpc-usb-uart"]'
  build-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_s_right"]'
      snippet: '["studio-rpc-usb-uart"]'
