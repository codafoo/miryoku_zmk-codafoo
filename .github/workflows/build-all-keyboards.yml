name: 'Build All Keyboards'
on: workflow_dispatch
jobs:
  # Corne
  corne-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_left nice_view_adapter nice_view"]'
  corne-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_right nice_view_adapter nice_view"]'
  # Urchin
  urchin-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["urchin_left nice_view_adapter nice_view"]'
  urchin-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["urchin_right nice_view_adapter nice_view"]'

  # Ergonaut One (seeeduino_xiao_ble)
  ergonaut-one-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_left"]'
  ergonaut-one-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_right"]'

  # Ergonaut One S (seeeduino_xiao_ble)
  ergonaut-one-s-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_s_left"]'
  ergonaut-one-s-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_s_right"]'

  # Settings Reset (for nice_nano_v2 boards)
  settings-reset-nice-nano:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["settings_reset"]'

  # Settings Reset (for seeeduino_xiao_ble boards)
  settings-reset-xiao:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["settings_reset"]'

  # Note: The following keyboards have individual build workflows but are excluded from
  # build-all due to shield detection issues with the current build system:
  # - flake (anywhy_flake_left/right shields - use build-flake.yml individually)
  # - roBa (roBa_L/R shields - use build-roBa.yml individually)
  #
  # Shield files exist in boards/shields/ but aren't detected by the Miryoku build system.
