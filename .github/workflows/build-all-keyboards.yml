name: 'Build All Keyboards'
on: workflow_dispatch
jobs:
  # Corne
  corne-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_left nice_view_adapter nice_view"]'
  corne-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_right nice_view_adapter nice_view"]'
  # Urchin
  urchin-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["urchin_left nice_view_adapter nice_view"]'
  urchin-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["urchin_right nice_view_adapter nice_view"]'

  # Settings Reset (works for all boards)
  settings-reset:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["settings_reset"]'

  # Note: The following keyboards are disabled pending shield definitions:
  # - ergonaut_one (shield not in upstream ZMK)
  # - flake (shield not in upstream ZMK)
  # - roBa (outboard config not working properly)
  #
  # To enable these keyboards, shield definitions need to be added to upstream ZMK
  # or proper outboard configurations need to be created.
