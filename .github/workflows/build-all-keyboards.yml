name: 'Build All Keyboards'
on: workflow_dispatch
jobs:
  # Corne
  corne-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_left nice_view_adapter nice_view"]'
  corne-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_right nice_view_adapter nice_view"]'
  # Urchin
  urchin-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["urchin_left nice_view_adapter nice_view"]'
  urchin-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["urchin_right nice_view_adapter nice_view"]'

  # Ergonaut One (seeeduino_xiao_ble)
  ergonaut-one-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_left"]'
  ergonaut-one-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_right"]'

  # Ergonaut One S (seeeduino_xiao_ble)
  ergonaut-one-s-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_s_left"]'
  ergonaut-one-s-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["ergonaut_one_s_right"]'

  # Settings Reset (for nice_nano_v2 boards)
  settings-reset-nice-nano:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["settings_reset"]'

  # Settings Reset (for seeeduino_xiao_ble boards)
  settings-reset-xiao:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["settings_reset"]'

  # Flake (nice_nano_v2 - uses v1.0 with pro_micro connector)
  flake-nicenano-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["anywhy_flake_left"]'
  flake-nicenano-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["anywhy_flake_right"]'

  # Flake (seeeduino_xiao_ble - uses main branch with xiao_d connector)
  flake-xiao-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["anywhy_flake_left"]'
  flake-xiao-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["anywhy_flake_right"]'

  # roBa (seeeduino_xiao_ble - with PMW3610 trackball)
  roBa-left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["roBa_left"]'
  roBa-right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["seeeduino_xiao_ble"]'
      shield: '["roBa_right"]'
