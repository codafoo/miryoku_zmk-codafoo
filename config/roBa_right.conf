# roBa Right Side Configuration with PMW3610 Trackball

CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_BT=y

CONFIG_SPI=y
CONFIG_INPUT=y

# PMW3610 Driver (using badjeff fork)
CONFIG_PMW3610=y

# Optional: Adjust reporting frequency (default is fine for most use cases)
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=8

# Optional: Enable debug logging
# CONFIG_PMW3610_LOG_LEVEL_DBG=y

# Optional: Add power-up delay for nice_nano_v2 boards
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=100

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

