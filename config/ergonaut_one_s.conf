# ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ZMK Studio RPC over USB CDC-ACM (equivalent to studio-rpc-usb-uart snippet)
CONFIG_ZMK_STUDIO_TRANSPORT_UART=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Ergonaut One S"
CONFIG_USB_DEVICE_MANUFACTURER="ErgonautKB"

# Keep all behaviors for ZMK Studio
CONFIG_ZMK_BEHAVIORS_KEEP_ALL=y

# Required for ZMK Studio on split keyboards
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# BLE
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
