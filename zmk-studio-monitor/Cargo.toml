[package]
name = "zmk-studio-monitor"
version = "0.1.0"
edition = "2021"
authors = ["ZMK User"]
description = "Real-time monitor for ZMK Studio keyboards"

[dependencies]
# HID communication
hidapi = "2.6"
# Terminal UI
ratatui = "0.27"
crossterm = "0.27"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
# Async runtime
tokio = { version = "1.0", features = ["full"] }
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Time handling
chrono = "0.4"
# Protocol
postcard = "1.0"
# Utilities
bytes = "1.5"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
