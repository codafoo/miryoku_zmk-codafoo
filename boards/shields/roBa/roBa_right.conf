# roBa Right Side Configuration with PMW3610 Trackball

# Mouse/Pointing Device Configuration
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y
CONFIG_INPUT_LISTENER=y

# PMW3610 Sensor Configuration
CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=400
CONFIG_PMW3610_CPI_DIVIDER=1
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SCROLL_TICK=16
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME=20
CONFIG_PMW3610_POLLING_RATE_SW=125
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0
CONFIG_PMW3610_SMART_ALGORITHM=y

# Automouse Configuration
CONFIG_ZMK_INPUT_LISTENER_INPUT_DEVICE_AUTOMOUSE=y
CONFIG_ZMK_INPUT_LISTENER_INPUT_DEVICE_AUTOMOUSE_TIMEOUT_MS=700

# Mouse key press input processor
CONFIG_ZMK_INPUT_PROCESSOR_TEMP_LAYER=y

# Rotary Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# BLE and Battery
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Enable NFC pins as GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y
